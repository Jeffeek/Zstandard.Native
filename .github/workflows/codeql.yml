name: CodeQL Security Analysis

on:
  workflow_call:        # Called from ci.yml after build/test passes
  workflow_dispatch:    # Manual trigger
  schedule:
    # Weekly Monday 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: csharp
          # security-extended adds rules tuned for unsafe P/Invoke and marshalling.
          queries: security-and-quality,security-extended
          config: |
            paths:
              - src
              - eng
            paths-ignore:
              - tests
              - samples
              - "**/bin/**"
              - "**/obj/**"

      - name: Setup .NET (no build — CodeQL does the build)
        uses: ./.github/actions/dotnet-setup
        with:
          build: 'false'

      - name: Build for analysis
        run: dotnet build src/Zstandard.Native/Zstandard.Native.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:csharp"
