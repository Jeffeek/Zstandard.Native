name: CodeQL Security Analysis

on:
  workflow_call:        # Called from ci.yml after build/test passes
  workflow_dispatch:    # Manual trigger
  schedule:
    # Weekly Monday 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          languages: csharp
          # security-extended adds rules tuned for unsafe P/Invoke and marshalling.
          queries: security-and-quality,security-extended
          config: |
            paths:
              - src
              - eng
            paths-ignore:
              - tests
              - samples
              - "**/bin/**"
              - "**/obj/**"

      - name: Setup .NET (no build — CodeQL does the build)
        uses: ./.github/actions/dotnet-setup
        with:
          build: 'false'

      - name: Build for analysis
        run: dotnet build src/Zstandard.Native/Zstandard.Native.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          category: "/language:csharp"
