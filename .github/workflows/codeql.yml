name: CodeQL Security Analysis

on:
  workflow_call:        # Called from ci.yml after build/test passes
  workflow_dispatch:    # Manual trigger
  schedule:
    # Weekly Monday 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          languages: csharp
          # security-extended adds rules tuned for unsafe P/Invoke and marshalling.
          queries: security-and-quality,security-extended
          config: |
            paths:
              - src
              - eng
            paths-ignore:
              - tests
              - samples
              - "**/bin/**"
              - "**/obj/**"

      - name: Setup .NET (no build — CodeQL does the build)
        uses: ./.github/actions/dotnet-setup
        with:
          build: 'false'

      - name: Build for analysis
        run: dotnet build src/Zstandard.Native/Zstandard.Native.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          category: "/language:csharp"
