name: CodeQL Security Analysis

on:
  workflow_call:        # Called from ci.yml after build/test passes
  workflow_dispatch:    # Manual trigger
  schedule:
    # Weekly Monday 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: csharp
          # security-extended adds rules tuned for unsafe P/Invoke and marshalling.
          queries: security-and-quality,security-extended
          config: |
            paths:
              - src
              - eng
            paths-ignore:
              - tests
              - samples
              - "**/bin/**"
              - "**/obj/**"

      - name: Setup .NET (no build — CodeQL does the build)
        uses: ./.github/actions/dotnet-setup
        with:
          build: 'false'

      - name: Build for analysis
        run: dotnet build src/Zstandard.Native/Zstandard.Native.csproj -c Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:csharp"
