name: ReSharper Code Analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-code:
    name: ReSharper InspectCode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch native libzstd (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd1
          bash scripts/FetchNatives/fetch-natives.sh

      - name: Setup .NET (restore + build)
        uses: ./.github/actions/dotnet-setup

      - name: ReSharper CLI InspectCode
        uses: muno92/resharper_inspectcode@891d22b65b6fe0620a0ab2379f23fecc031eef88 # 1.17.5
        with:
          solutionPath: ./Zstandard.Native.slnx
          version: 2025.3.3
          failOnIssue: '1'
          noBuild: true
          solutionWideAnalysis: true
          minimumReportSeverity: WARNING
          minimumSeverity: warning
          exclude: '**/obj/**;**/bin/**;**/TestResults/**;**/tests/**;**/samples/**'
          properties: 'Configuration=Release'
