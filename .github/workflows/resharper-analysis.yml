name: ReSharper Code Analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-code:
    name: ReSharper InspectCode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Fetch native libzstd (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd1
          bash scripts/fetch-natives.sh

      - name: Setup .NET (restore + build)
        uses: ./.github/actions/dotnet-setup

      - name: ReSharper CLI InspectCode
        uses: muno92/resharper_inspectcode@9dd06702fe04cae50fe448156b398c9912d3421b # 1.17.1
        with:
          solutionPath: ./Zstandard.Native.sln
          version: 2025.3.3
          failOnIssue: '1'
          noBuild: true
          solutionWideAnalysis: true
          minimumReportSeverity: WARNING
          minimumSeverity: warning
          exclude: '**/obj/**;**/bin/**;**/TestResults/**;**/tests/**;**/samples/**'
          properties: 'Configuration=Release'
