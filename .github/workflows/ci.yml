name: CI - Build and Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
      - "release/**"
  push:
    branches:
      - "master"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build & Test (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    rid: linux-x64   }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: windows-latest,   rid: win-x64     }
          - { runner: windows-11-arm,   rid: win-arm64   }
          - { runner: macos-15-intel,   rid: osx-x64     }
          - { runner: macos-15,         rid: osx-arm64   }

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch native libzstd
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y libzstd1
              bash scripts/FetchNatives/fetch-natives.sh
              ;;
            macOS)
              brew install zstd
              bash scripts/FetchNatives/fetch-natives.sh
              ;;
            Windows)
              pwsh scripts/FetchNatives/fetch-natives.ps1
              ;;
          esac

      - name: Verify native binary present
        shell: bash
        run: ls -la runtimes/${{ matrix.rid }}/native/

      - name: Setup .NET (restore + build)
        uses: ./.github/actions/dotnet-setup

      - name: Test with coverage
        timeout-minutes: ${{ matrix.rid == 'linux-arm64' && 30 || 15 }}
        run: >
          dotnet test tests/Zstandard.Native.Tests/Zstandard.Native.Tests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./artifacts/test-results
          flags: ${{ matrix.rid }}
          fail_ci_if_error: false
          verbose: false

  codeql-analysis:
    name: CodeQL Security Analysis
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/codeql.yml
