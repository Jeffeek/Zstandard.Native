name: CI - Build and Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
      - "release/**"
  push:
    branches:
      - "master"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: Build & Test (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    rid: linux-x64   }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: windows-latest,   rid: win-x64     }
          - { runner: windows-11-arm,   rid: win-arm64   }
          - { runner: macos-15-intel,   rid: osx-x64     }
          - { runner: macos-15,         rid: osx-arm64   }

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch native libzstd
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y libzstd1
              bash scripts/FetchNatives/fetch-natives.sh
              ;;
            macOS)
              brew install zstd
              bash scripts/FetchNatives/fetch-natives.sh
              ;;
            Windows)
              pwsh scripts/FetchNatives/fetch-natives.ps1
              ;;
          esac

      - name: Verify native binary present
        shell: bash
        run: ls -la runtimes/${{ matrix.rid }}/native/

      - name: Setup .NET (restore + build)
        uses: ./.github/actions/dotnet-setup

      - name: Test
        timeout-minutes: ${{ matrix.rid == 'linux-arm64' && 30 || 15 }}
        run: >
          dotnet test tests/Zstandard.Native.Tests/Zstandard.Native.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results
          if-no-files-found: warn

  test-with-coverage:
    name: Test with Coverage (linux-x64)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch native libzstd
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd1
          bash scripts/fetch-natives.sh

      - name: Setup .NET (restore + build)
        uses: ./.github/actions/dotnet-setup

      - name: Run tests with coverage
        run: >
          dotnet test tests/Zstandard.Native.Tests/Zstandard.Native.Tests.csproj
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
        timeout-minutes: 10

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: ./coverage
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false
          verbose: true

  codeql-analysis:
    name: CodeQL Security Analysis
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/codeql.yml
