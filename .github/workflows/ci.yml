name: ci

on:
  push:
    branches: [master, "release/v*"]
  pull_request:
    branches: [master, "release/v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x64,   runner: ubuntu-latest,   rid: linux-x64   }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows, arch: x64,   runner: windows-latest,  rid: win-x64     }

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore (locked, audited)
        run: dotnet restore Zstandard.Native.sln --locked-mode || dotnet restore Zstandard.Native.sln
        env:
          NuGetAudit: "true"
          NuGetAuditMode: "all"
          NuGetAuditLevel: "low"

      - name: Build
        run: dotnet build Zstandard.Native.sln -c Release --no-restore -warnaserror

      - name: Test
        # Linux arm64 cross-arch runners are slower; bump timeout there.
        timeout-minutes: ${{ matrix.arch == 'arm64' && 30 || 15 }}
        run: >
          dotnet test tests/Zstandard.Native.Tests/Zstandard.Native.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/test-results
          if-no-files-found: warn

  pack:
    name: pack (preview, sanity)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Compute version (dry-run)
        id: version
        run: bash scripts/release.sh
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Pack
        run: >
          dotnet pack src/Zstandard.Native/Zstandard.Native.csproj
          -c Release
          -o artifacts/nupkg
          -p:VersionPrefix=${{ steps.version.outputs.version_prefix }}
          -p:VersionSuffix=${{ steps.version.outputs.version_suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-preview
          path: artifacts/nupkg
