name: Release Package

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.2.3, v1.0.0-preview.1
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, pack, and run the AOT gate but skip the NuGet push."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-progress release

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # ---------------------------------------------------------------
  # 1. Extract the version from the tag.
  # ---------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
      is_prerelease: ${{ steps.get.outputs.is_prerelease }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - id: get
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch is only supported when also pushing a v* tag." >&2
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $VERSION"

  # ---------------------------------------------------------------
  # 2. Build + test on every RID. Each runner fetches its native
  #    libzstd and uploads it as a per-RID artifact so the pack
  #    job below produces a real multi-RID nupkg.
  # ---------------------------------------------------------------
  verify:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest,    rid: linux-x64   }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: windows-latest,   rid: win-x64     }
          - { runner: windows-11-arm,   rid: win-arm64   }
          - { runner: macos-15-intel,   rid: osx-x64     }
          - { runner: macos-15,         rid: osx-arm64   }

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch native libzstd
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y libzstd1
              bash scripts/FetchNatives/fetch-natives.sh
              ;;
            macOS)
              brew install zstd
              bash scripts/FetchNatives/fetch-natives.sh
              ;;
            Windows)
              pwsh scripts/FetchNatives/fetch-natives.ps1
              ;;
          esac

      - name: Upload native binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: natives-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/
          if-no-files-found: error

      - name: Setup .NET (restore + build)
        uses: ./.github/actions/dotnet-setup

      - name: Test
        run: dotnet test tests/Zstandard.Native.Tests/Zstandard.Native.Tests.csproj -c Release --no-build

  # ---------------------------------------------------------------
  # 3. Pack with binaries from every RID merged into runtimes/.
  # ---------------------------------------------------------------
  pack:
    needs: [version, verify]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET (no build yet)
        uses: ./.github/actions/dotnet-setup
        with:
          build: 'false'

      - name: Download natives for every RID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/natives
          pattern: natives-*

      - name: Stage natives under runtimes/<rid>/native/
        shell: bash
        run: |
          set -euo pipefail
          for dir in artifacts/natives/natives-*; do
            rid="${dir##*/natives-}"
            mkdir -p "runtimes/${rid}/native"
            cp -f "${dir}"/* "runtimes/${rid}/native/"
            ls -la "runtimes/${rid}/native/"
          done

      - name: Pack all packages
        # PACK_COMMANDS_START
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          OUT="./artifacts/nupkg"

          # 1. Per-RID binary carrier packages
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dotnet pack src/Zstandard.Native.Runtime/Zstandard.Native.Runtime.csproj \
              -c Release --output "$OUT" \
              -p:PackageVersion="$VERSION" \
              -p:RuntimePackageRid="$rid"
          done

          # 2. Meta-package — register the just-packed per-RID packages as a local
          #    feed so NuGet can resolve them and write the deps into the nuspec.
          dotnet nuget add source "$PWD/$OUT" --name local-nupkg
          dotnet pack src/Zstandard.Native.Runtimes/Zstandard.Native.Runtimes.csproj \
            -c Release --output "$OUT" \
            -p:PackageVersion="$VERSION"

          # 3. Managed-only core package
          dotnet pack src/Zstandard.Native/Zstandard.Native.csproj \
            -c Release --output "$OUT" \
            -p:PackageVersion="$VERSION"
        # PACK_COMMANDS_END

      - name: Inspect pack contents
        shell: bash
        run: |
          set -euo pipefail
          for nupkg in artifacts/nupkg/*.nupkg; do
            echo "=== $nupkg ==="
            # List files in the archive
            unzip -l "$nupkg" | grep -E "lib/|runtimes/" || true
            # Extract and print the nuspec to show dependencies and metadata
            unzip -p "$nupkg" "*.nuspec" 2>/dev/null | grep -E "<dependency|<id>|<version>" || true
          done

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: ./artifacts/nupkg

  # ---------------------------------------------------------------
  # 4. NATIVE AOT VALIDATION GATE — publish a consumer probe with
  #    PublishAot=true and require its native binary to round-trip.
  # ---------------------------------------------------------------
  aot-gate:
    name: AOT gate (${{ matrix.rid }})
    needs: [version, pack]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest,    rid: linux-x64   }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: windows-latest,   rid: win-x64     }
          - { runner: windows-11-arm,   rid: win-arm64   }
          - { runner: macos-15-intel,   rid: osx-x64     }
          - { runner: macos-15,         rid: osx-arm64   }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libzstd1

      - name: Install macOS runtime libzstd
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: artifacts/nupkg

      - name: Configure local-only NuGet feed
        shell: bash
        run: |
          cat > eng/AotProbe/NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../../artifacts/nupkg" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Zstandard.Native" />
                <package pattern="Zstandard.Native.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Publish AOT probe
        working-directory: eng/AotProbe
        run: >
          dotnet publish AotProbe.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish
          -p:ZstandardNativeVersion=${{ needs.version.outputs.version }}
          -p:PublishAot=true
          -warnaserror

      - name: Run AOT probe
        shell: bash
        working-directory: eng/AotProbe/publish
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./AotProbe.exe
          else
            chmod +x ./AotProbe
            ./AotProbe
          fi

  # ---------------------------------------------------------------
  # 5. GitHub Release + nuget.org push (gated on every check).
  # ---------------------------------------------------------------
  publish:
    name: Publish to NuGet.org
    needs: [version, pack, aot-gate]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment:
      name: nuget
    permissions:
      contents: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Download nupkg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: artifacts/nupkg

      - name: List artifacts
        run: ls -la ./artifacts/nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ./artifacts/nupkg/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload nupkg to workflow artifacts (30-day retention)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages-${{ needs.version.outputs.version }}
          path: ./artifacts/nupkg/*.nupkg
          retention-days: 30

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "./artifacts/nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
