name: Release Package

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v1.2.3, v1.0.0-preview.1
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, pack, and run the AOT gate but skip the NuGet push."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-progress release

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # ---------------------------------------------------------------
  # 1. Extract the version from the tag.
  # ---------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
      tag: ${{ steps.get.outputs.tag }}
      is_prerelease: ${{ steps.get.outputs.is_prerelease }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - id: get
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch is only supported when also pushing a v* tag." >&2
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $VERSION"

  # ---------------------------------------------------------------
  # 2. Build + test on every RID. Each runner fetches its native
  #    libzstd and uploads it as a per-RID artifact so the pack
  #    job below produces a real multi-RID nupkg.
  # ---------------------------------------------------------------
  verify:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest,    rid: linux-x64   }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: windows-latest,   rid: win-x64     }
          - { runner: macos-13,         rid: osx-x64     }
          - { runner: macos-14,         rid: osx-arm64   }

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch native libzstd
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y libzstd1
              bash scripts/fetch-natives.sh
              ;;
            macOS)
              brew install zstd
              bash scripts/fetch-natives.sh
              ;;
            Windows)
              pwsh scripts/fetch-natives.ps1
              ;;
          esac

      - name: Upload native binary artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: natives-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native/
          if-no-files-found: error

      - name: Setup .NET (restore + build)
        uses: ./.github/actions/dotnet-setup

      - name: Test
        run: dotnet test tests/Zstandard.Native.Tests/Zstandard.Native.Tests.csproj -c Release --no-build

  # ---------------------------------------------------------------
  # 3. Pack with binaries from every RID merged into runtimes/.
  # ---------------------------------------------------------------
  pack:
    needs: [version, verify]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET (no build yet)
        uses: ./.github/actions/dotnet-setup
        with:
          build: 'false'

      - name: Download natives for every RID
        uses: actions/download-artifact@d3f86a106a0bac45b6f43b80c1e7d3affe51ec92 # v4.3.0
        with:
          path: artifacts/natives
          pattern: natives-*

      - name: Stage natives under runtimes/<rid>/native/
        shell: bash
        run: |
          set -euo pipefail
          for dir in artifacts/natives/natives-*; do
            rid="${dir##*/natives-}"
            mkdir -p "runtimes/${rid}/native"
            cp -f "${dir}"/* "runtimes/${rid}/native/"
            ls -la "runtimes/${rid}/native/"
          done

      - name: Pack
        # PACK_COMMANDS_START
        run: >
          dotnet pack src/Zstandard.Native/Zstandard.Native.csproj
          -c Release
          --output ./artifacts/nupkg
          -p:PackageVersion=${{ needs.version.outputs.version }}
        # PACK_COMMANDS_END
        timeout-minutes: 20

      - name: Inspect pack contents
        shell: bash
        run: |
          set -euo pipefail
          for nupkg in artifacts/nupkg/*.nupkg; do
            echo "=== $nupkg ==="
            unzip -l "$nupkg" | grep -E "lib/|runtimes/" || true
          done

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nupkg
          path: ./artifacts/nupkg

  # ---------------------------------------------------------------
  # 4. NATIVE AOT VALIDATION GATE — publish a consumer probe with
  #    PublishAot=true and require its native binary to round-trip.
  # ---------------------------------------------------------------
  aot-gate:
    name: AOT gate (${{ matrix.rid }})
    needs: [version, pack]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest,    rid: linux-x64   }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
          - { runner: windows-latest,   rid: win-x64     }
          - { runner: macos-13,         rid: osx-x64     }
          - { runner: macos-14,         rid: osx-arm64   }
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux AOT toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libzstd1

      - name: Install macOS runtime libzstd
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Download nupkg
        uses: actions/download-artifact@d3f86a106a0bac45b6f43b80c1e7d3affe51ec92 # v4.3.0
        with:
          name: nupkg
          path: artifacts/nupkg

      - name: Configure local-only NuGet feed
        shell: bash
        run: |
          cat > eng/AotProbe/NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../../artifacts/nupkg" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Zstandard.Native" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

      - name: Publish AOT probe
        working-directory: eng/AotProbe
        run: >
          dotnet publish AotProbe.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o publish
          -p:ZstandardNativeVersion=${{ needs.version.outputs.version }}
          -p:PublishAot=true
          -warnaserror

      - name: Run AOT probe
        shell: bash
        working-directory: eng/AotProbe/publish
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./AotProbe.exe
          else
            chmod +x ./AotProbe
            ./AotProbe
          fi

  # ---------------------------------------------------------------
  # 5. GitHub Release + nuget.org push (gated on every check).
  # ---------------------------------------------------------------
  publish:
    name: Publish to NuGet.org
    needs: [version, pack, aot-gate]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment:
      name: nuget
    permissions:
      contents: write
      packages: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      - name: Download nupkg
        uses: actions/download-artifact@d3f86a106a0bac45b6f43b80c1e7d3affe51ec92 # v4.3.0
        with:
          name: nupkg
          path: artifacts/nupkg

      - name: List artifacts
        run: ls -la ./artifacts/nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: ./artifacts/nupkg/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload nupkg to workflow artifacts (30-day retention)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nuget-packages-${{ needs.version.outputs.version }}
          path: ./artifacts/nupkg/*.nupkg
          retention-days: 30

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "./artifacts/nupkg/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
